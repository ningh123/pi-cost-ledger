name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The declared engines floor (>= 22.19.0) plus the active LTS.
        node: [22.19.0, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Assert the packaged files cover the extension entry points
        # npm pack --dry-run always exits 0, so the file list has to be
        # asserted explicitly: a "files" whitelist that misses a module ships
        # a package that installs clean and crashes on load, with every check
        # above still green.
        run: |
          npm pack --dry-run --json | node -e '
            const expected = ["index.ts", "dashboard.ts", "parse.ts", "ledger.ts", "render.ts", "sessions.ts", "settings.ts", "usage.ts", "time.ts", "CHANGELOG.md"];
            const packed = JSON.parse(require("fs").readFileSync(0, "utf8"))[0].files.map((f) => f.path);
            const missing = expected.filter((e) => !packed.some((p) => p === e || p.startsWith(e + "/")));
            if (missing.length) { console.error("pack missing:", missing.join(", ")); process.exit(1); }
          '
